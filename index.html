function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2100); }

/* ================= input ================= */
document.addEventListener('click', e => {
  const bg = e.target.closest('[data-ovbg]'); if (bg && e.target === bg) { $ov.innerHTML = ''; return; }
  const el = e.target.closest('[data-act]'); if (!el) return; const act = el.dataset.act, v = el.dataset.v; const st = G.st;
  switch (act) {
    case 'setup': G.setup.channelName = (document.getElementById('cname') || {}).value || G.setup.channelName; G.setup[el.dataset.k] = v; SND.fx('tap'); render(); break;
    case 'start': { G.setup.channelName = (document.getElementById('cname') || {}).value || ''; const go = () => { if (prefs.music) SND.startMusic(); startGame(Object.assign({}, G.setup, { channelName: G.setup.channelName.trim() || 'My Channel' })); }; if (G.save && !G.save.recorded && G.save.turns.length > 1) { G._go = go; $ov.innerHTML = '<div class="ov"><div class="sheet"><h2>Start over?</h2><div class="small">Your saved game (month ' + (G.save.turns.length + 1) + ') will be replaced.</div><div class="row"><button class="btn grow" data-act="closeOv">Cancel</button><button class="btn p grow" data-act="confirmNew">Start new</button></div></div></div>'; } else go(); break; }
    case 'confirmNew': $ov.innerHTML = ''; G._go && G._go(); break;
    case 'continue': if (prefs.music) SND.startMusic(); loadSave(G.save); render(); if (G.screen === 'game' && st == null) monthIntro(); break;
    case 'help': helpSheet(); break;
    case 'menu': menuSheet(); break;
    case 'music': prefs.music = !prefs.music; lsSet(LSP, prefs); if (prefs.music) SND.startMusic(); else SND.stopMusic(); G.setup.channelName = (document.getElementById('cname') || {}).value || G.setup.channelName; if ($ov.innerHTML) menuSheet(); render(); toast(prefs.music ? '🎵 Ambient music on' : 'Music off'); break;
    case 'sfx': prefs.sfx = !prefs.sfx; SND.sfxOn = prefs.sfx; lsSet(LSP, prefs); menuSheet(); break;
    case 'closeOv': $ov.innerHTML = ''; break;
    case 'home': $ov.innerHTML = ''; G.screen = 'home'; render(); break;
    case 'tab': G.tab = v; G.channel = null; SND.fx('tap'); render(); document.getElementById('page') && (document.getElementById('page').scrollTop = 0); break;
    case 'gym': { const P = st.plan[0]; doAct({ type: 'gym', n: P.gym + (+el.dataset.d) }); render(); break; }
    case 'study': { const P = st.plan[0]; doAct({ type: 'study', skill: P.study.skill, hours: Math.max(0, P.study.hours + (+el.dataset.d)) }); render(); break; }
    case 'studySkill': { const P = st.plan[0]; doAct({ type: 'study', skill: v, hours: P.study.hours }); render(); break; }
    case 'job': { const P = st.plan[0]; doAct({ type: 'job', hours: Math.max(0, P.job + (+el.dataset.d)) }); render(); break; }
    case 'maker': openMaker(null); SND.fx('tap'); break;
    case 'makerWith': { const card = T.topicCards(st)[+v]; openMaker(card); break; }
    case 'closeMaker': G.maker = null; $ov.innerHTML = ''; break;
    case 'pickTopic': { const card = T.topicCards(st)[+v]; G.maker.card = card.kind ? card : null; G.maker.topic = { lane: card.lane, i: card.i }; SND.fx('tap'); renderMaker(); break; }
    case 'style': G.maker.style = v; SND.fx('tap'); renderMaker(); break;
    case 'angle': G.maker.angle = v; SND.fx('tap'); renderMaker(); break;
    case 'hrs': { const k = el.dataset.k; G.maker.hours[k] = Math.max(k === 'film' ? 0 : 1, Math.min(60, G.maker.hours[k] + (+el.dataset.d))); renderMaker(); break; }
    case 'sponsor': G.maker.sponsor = +v < 0 ? null : +v; renderMaker(); break;
    case 'series': G.maker.series = !G.maker.series; renderMaker(); break;
    case 'addVideo': { const r = doAct({ type: 'video', spec: specOf() }); if (r && r.ok) { G.maker = null; $ov.innerHTML = ''; SND.fx('add'); G.tab = 'studio'; render(); toast('🎬 Video scheduled'); } break; }
    case 'unvideo': doAct({ type: 'unvideo', index: +v }); render(); break;
    case 'end': { if (st.plan[0].videos.length === 0) { $ov.innerHTML = '<div class="ov"><div class="sheet"><h2>No videos this month?</h2><div class="small">Subscribers drift away when you don\'t post.</div><div class="row"><button class="btn grow" data-act="closeOv">Make one</button><button class="btn p grow" data-act="endYes">End anyway</button></div></div></div>'; break; } endMonth(); break; }
    case 'endYes': $ov.innerHTML = ''; endMonth(); break;
    case 'afterRace': summary(); break;
    case 'nextMonth': if (G.st.over) { $ov.innerHTML = ''; finishGame(); break; } G.tab = 'studio'; G.channel = null; render(); monthIntro(); break;
    case 'milestone': { const r = doAct({ type: 'milestone', choice: v }); if (r && r.ok) { SND.fx('level'); toast('🎉 ' + r.label); } render(); if ($ov.innerHTML && G.st.creators[0].pending == null) $ov.innerHTML = ''; else if (G.st.creators[0].pending != null && $ov.innerHTML) monthIntro(); break; }
    case 'openCh': G.tab = 'channels'; G.channel = +v; SND.fx('tap'); render(); break;
    case 'backCh': G.channel = null; render(); break;
    case 'askCollab': { const r = doAct({ type: 'askCollab', to: +v }); if (r && r.ok) { SND.fx('level'); toast('🤝 Yes! Make the collab video this month.'); } render(); break; }
    case 'hire': { const r = doAct({ type: 'hire', cand: +v }); if (r && r.ok) SND.fx('level'); render(); break; }
    case 'fire': doAct({ type: 'fire', staff: +v }); render(); break;
    case 'merch': { const r = doAct({ type: 'merch' }); if (r && r.ok) SND.fx('coin'); render(); break; }
    case 'dropout': $ov.innerHTML = '<div class="ov"><div class="sheet"><h2>Drop out?</h2><div class="small">100 hours a month, living costs €1,000. Can\'t be undone.</div><div class="row"><button class="btn grow" data-act="closeOv">Stay</button><button class="btn p grow" data-act="dropYes">Drop out</button></div></div></div>'; break;
    case 'dropYes': $ov.innerHTML = ''; doAct({ type: 'dropout' }); render(); break;
    case 'review': G.screen = 'review'; render(); break;
    case 'backEnd': G.screen = 'end'; render(); break;
    case 'rewind': { const turn = +v; const save = { v: 3, opts: Object.assign({}, G.save.opts, { practice: true }), turns: G.save.turns.slice(0, turn - 1), cur: [], updated: Date.now() }; loadSave(save); G.save = save; persist(); render(); monthIntro(); toast('Practice run from ' + T.dateOf(turn).label); break; }
  }
});

/* ================= boot ================= */
function start(data) {
  G.stats = lsGet(LSS) || { games: [] }; G.save = (data && data.save) || lsGet(LS);
  if (data && data.save) { try { loadSave(data.save); } catch (e) { G.screen = 'home'; } }
  render(); initDb();
  if (prefs.music) { const kick = () => { SND.startMusic(); document.removeEventListener('pointerdown', kick); }; document.addEventListener('pointerdown', kick); }
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ save: G.save }));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
